<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorías - Lifehub</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Calorias</h1>

        <div class="bg-white rounded-lg shadow p-6">

            <!-- Formulario -->
            <form id="caloriasForm" class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                    <input type="date" name="fecha" required class="w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Calorías</label>
                    <input type="number" name="calorias" required min="0" class="w-full px-3 py-2 border rounded-md">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                        Agregar
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-lg shadow-md  my-8 pt-8">
            <div class="overflow-x-auto mb-6">
                <table class="min-w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-2 text-left">Fecha</th>
                            <th class="px-4 py-2 text-left">Calorías</th>
                            <th class="px-4 py-2 text-left">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="caloriasTableBody">
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Gráfico -->
        <div class="bg-white rounded-lg shadow-md  my-8 pt-8">
            <canvas id="caloriasChart" height="200"></canvas>
        </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="js/include.js"></script>
    <script src="js/calorias.js"></script>
    <script src="js/utils.js"></script>
</body>

</html>
