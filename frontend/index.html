<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifehub Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-900 text-white py-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center px-4">
            <h1 class="text-2xl font-bold tracking-wide">Lifehub Dashboard</h1>
            <span class="text-sm">by Fernando Michea</span>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-1 container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-800">Saldo Bancario</h2>
                <canvas id="saldoChart" height="200"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-800">Calorías</h2>
                <canvas id="caloriasChart" height="200"></canvas>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white py-4 mt-8">
        <div class="container mx-auto text-center text-sm">
            &copy; 2024 Lifehub. Todos los derechos reservados.
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
