version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifehub-backend
    restart: always
    ports:
      - "8092:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:123@mariadb:3306/lifehub
    networks:
      - app-network

  frontend:
    image: nginx:alpine
    container_name: lifehub-frontend
    restart: always
    ports:
      - "8091:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    external:
      name: doli-brik 